# Publica as páginas públicas do Studvya no GitHub Pages.
#
# Este workflow existe porque o Pages precisa ser ligado uma vez, e ligar pela
# interface exigiria acesso à conta. O `configure-pages` com `enablement: true`
# faz isso usando o token efêmero do próprio Actions, que vale só para esta
# execução e some depois — nenhum segredo pessoal entra na jogada.
#
# Depois de ligado, cada push na `main` republica o site.

name: Publicar site

on:
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions, se um dia precisar.
  workflow_dispatch:

# O mínimo necessário: ler o repositório e escrever no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Se dois pushes chegarem juntos, o segundo espera em
# vez de competir — mas não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Ligar o Pages, se ainda não estiver
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # A raiz do repositório é o site: os quatro HTML são irmãos e se ligam
      # por caminho relativo. Não há build.
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
